name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/guernseytides:latest
          build-args: |
            FONTAWESOME_TOKEN=${{ secrets.FONTAWESOME_TOKEN }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            TIDE_URL=${{ secrets.TIDE_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{secrets.VPS_SSH_PORT}}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository_owner }}/guernseytides:latest
            docker stop guernseytides || true
            docker rm guernseytides || true
            docker run -d \
              --name guernseytides \
              --network web \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
              -e TIDE_URL="${{ secrets.TIDE_URL }}" \
              -e NODE_ENV=production \
              -e PORT=5000 \
              -e HOST=0.0.0.0 \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.guernsey.rule=Host(\`guernseytides.co.uk\`)" \
              --label "traefik.http.routers.guernsey.entrypoints=websecure" \
              --label "traefik.http.routers.guernsey.tls=true" \
              --label "traefik.http.routers.guernsey.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.guernsey.loadbalancer.server.port=5000" \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/guernseytides:latest
            docker logout ghcr.io
