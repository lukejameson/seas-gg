name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/guernseytides:latest
          build-args: |
            FONTAWESOME_TOKEN=${{ secrets.FONTAWESOME_TOKEN }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            TIDE_URL=${{ secrets.TIDE_URL }}
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }} 
          key_passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository_owner }}/guernseytides:latest
            docker stop guernseytides || true
            docker rm guernseytides || true
            docker run -d \
              --name guernseytides \
              -p 3000:3000 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/guernseytides:latest
            docker logout ghcr.io