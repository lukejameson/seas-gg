name: Deploy to VPS
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm install @rollup/rollup-linux-x64-gnu
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/seas-gg:latest
          build-args: |
            TIDE_URL=${{ secrets.TIDE_URL }}
            SEA_TEMP_URL=${{secrets.SEA_TEMP_URL}}
            POSTGRES_HOST=${{secrets.POSTGRES_HOST}}
            POSTGRES_PORT=${{secrets.POSTGRES_PORT}}
            POSTGRES_DATABASE=${{secrets.POSTGRES_DATABASE}}
            POSTGRES_USER=${{secrets.POSTGRES_USER}}
            POSTGRES_PASSWORD=${{secrets.POSTGRES_PASSWORD}}
            POSTGRES_SSL=${{secrets.POSTGRES_SSL}}
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          TIDE_URL: ${{ secrets.TIDE_URL }}
          SEA_TEMP_URL: ${{ secrets.SEA_TEMP_URL }}
          POSTGRES_HOST: ${{secrets.POSTGRES_HOST}}
          POSTGRES_PORT: ${{secrets.POSTGRES_PORT}}
          POSTGRES_DATABASE: ${{secrets.POSTGRES_DATABASE}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
          POSTGRES_SSL: ${{secrets.POSTGRES_SSL}}
        with:
          host: ${{ secrets.VPS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{secrets.VPS_SSH_PORT}}
          envs: POSTGRES_HOST,POSTGRES_PORT,POSTGRES_DATABASE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_SSL,TIDE_URL,SEA_TEMP_URL
          script: |
            cd ~/docker-apps/seas-gg
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository_owner }}/seas-gg:latest
            TIDE_URL=$TIDE_URL \
            SEA_TEMP_URL=$SEA_TEMP_URL \
            POSTGRES_HOST=$POSTGRES_HOST \
            POSTGRES_PORT=$POSTGRES_PORT \
            POSTGRES_DATABASE=$POSTGRES_DATABASE \
            POSTGRES_USER=$POSTGRES_USER \
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            POSTGRES_SSL=$POSTGRES_SSL \
            docker compose down
            TIDE_URL=$TIDE_URL \
            SEA_TEMP_URL=$SEA_TEMP_URL \
            POSTGRES_HOST=$POSTGRES_HOST \
            POSTGRES_PORT=$POSTGRES_PORT \
            POSTGRES_DATABASE=$POSTGRES_DATABASE \
            POSTGRES_USER=$POSTGRES_USER \
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            POSTGRES_SSL=$POSTGRES_SSL \
            docker compose up -d
            docker logout ghcr.io
