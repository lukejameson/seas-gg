name: Deploy to VPS
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:latest
          buildkitd-flags: --debug
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seas-gg:latest
            ghcr.io/${{ github.repository_owner }}/seas-gg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TIDE_URL: ${{ secrets.TIDE_URL }}
          SEA_TEMP_URL: ${{ secrets.SEA_TEMP_URL }}
        with:
          host: ${{ secrets.VPS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{secrets.VPS_SSH_PORT}}
          envs: SUPABASE_URL,SUPABASE_KEY,TIDE_URL,SEA_TEMP_URL
          script: |
            cd ~/docker-apps/seas-gg
            echo "Logging into GitHub Container Registry..."
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            echo "Pulling latest image..."
            docker pull ghcr.io/${{ github.repository_owner }}/seas-gg:latest

            echo "Updating application..."
            docker compose down --remove-orphans

            export SUPABASE_URL=$SUPABASE_URL
            export SUPABASE_KEY=$SUPABASE_KEY
            export TIDE_URL=$TIDE_URL
            export SEA_TEMP_URL=$SEA_TEMP_URL

            docker compose up -d

            echo "Cleaning up..."
            docker system prune -f
            docker logout ghcr.io
