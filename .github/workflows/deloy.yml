name: Deploy to VPS
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23'
      - name: Cache npm packages
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" > .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_TOKEN }}" >> .npmrc
          npm ci
          rm .npmrc
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/seas-gg:latest
          build-args: |
            FONTAWESOME_TOKEN=${{ secrets.FONTAWESOME_TOKEN }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            TIDE_URL=${{ secrets.TIDE_URL }}
            SEA_TEMP_URL=${{secrets.SEA_TEMP_URL}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to VPS
              uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.VPS }}
                username: ${{ secrets.VPS_USERNAME }}
                key: ${{ secrets.VPS_SSH_KEY }}
                passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
                port: ${{secrets.VPS_SSH_PORT}}
                script: |
                  cd ~/docker-apps/seas-gg
                  # Create docker-compose.yml if it doesn't exist
                  cat > docker-compose.yml << 'EOL'
                  services:
                    sveltekit-app:
                      image: ghcr.io/${{ github.repository_owner }}/seas-gg:latest
                      container_name: seas-gg
                      environment:
                        - SUPABASE_URL=${SUPABASE_URL}
                        - SUPABASE_KEY=${SUPABASE_KEY}
                        - SEA_TEMP_URL=${SEA_TEMP_URL}
                        - TIDE_URL=${TIDE_URL}
                      restart: unless-stopped
                      labels:
                        - 'traefik.enable=true'
                        - 'traefik.docker.network=web'
                        - 'traefik.http.routers.seas-gg.rule=Host(`seas.gg`)'
                        - 'traefik.http.routers.seas-gg.entrypoints=websecure'
                        - 'traefik.http.routers.seas-gg.tls.certresolver=letsencrypt'
                        - 'traefik.http.services.seas-gg.loadbalancer.server.port=5000'
                        - 'traefik.http.middlewares.security-headers.headers.frameDeny=true'
                        - 'traefik.http.middlewares.security-headers.headers.sslRedirect=true'
                        - 'traefik.http.middlewares.security-headers.headers.browserXssFilter=true'
                        - 'traefik.http.routers.seas-gg.middlewares=security-headers@docker'
                      networks:
                        - web
                  networks:
                    web:
                      external: true
                  EOL

                  # Create .env file
                  cat > .env << 'EOL'
                  SUPABASE_URL=${SUPABASE_URL}
                  SUPABASE_KEY=${SUPABASE_KEY}
                  TIDE_URL=${TIDE_URL}
                  EOL

                  docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
                  docker pull ghcr.io/${{ github.repository_owner }}/seas-gg:latest
                  docker compose down
                  docker compose up -d
                  docker logout ghcr.io