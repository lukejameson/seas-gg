services:
  sveltekit-app:
    build:
      context: .
      args:
        - FONTAWESOME_TOKEN=${FONTAWESOME_TOKEN}
        - SUPABASE_URL=${SUPABASE_URL}
        - SUPABASE_KEY=${SUPABASE_KEY}
        - TIDE_URL=${TIDE_URL}
    container_name: guernseytides
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - TIDE_URL=${TIDE_URL}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tides.rule=Host(`guernseytides.co.uk`)"
      - "traefik.http.routers.tides.entrypoints=websecure"
      - "traefik.http.routers.tides.tls.certresolver=letsencrypt"
      # Handle static assets with correct MIME types
      - "traefik.http.middlewares.tides-headers.headers.customResponseHeaders.Content-Type=application/javascript;charset=utf-8||text/css;charset=utf-8"
      - "traefik.http.routers.tides.middlewares=tides-headers"
      - "traefik.http.services.tides.loadbalancer.server.port=5000"
    networks:
      - web

networks:
  web:
    external: true
