services:
  sveltekit-app:
    build:
      context: .
      args:
        - FONTAWESOME_TOKEN=${FONTAWESOME_TOKEN}
        - SUPABASE_URL=${SUPABASE_URL}
        - SUPABASE_KEY=${SUPABASE_KEY}
        - TIDE_URL=${TIDE_URL}
    container_name: guernseytides
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - ORIGIN=https://guernseytides.co.uk
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - TIDE_URL=${TIDE_URL}
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.app.rule=Host(`guernseytides.co.uk`)'
      - 'traefik.http.routers.app.entrypoints=websecure'
      - 'traefik.http.routers.app.tls=true'
      - 'traefik.http.routers.app.tls.certresolver=letsencrypt'
      - 'traefik.http.services.app.loadbalancer.server.port=5000'
      # Headers for SvelteKit static assets
      - 'traefik.http.middlewares.sveltekit-headers.headers.customResponseHeaders.Cache-Control=public, max-age=31536000, immutable'
      - 'traefik.http.middlewares.sveltekit-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff'
      - "traefik.http.middlewares.sveltekit-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
      - 'traefik.http.routers.app.middlewares=sveltekit-headers'
    networks:
      - web

networks:
  web:
    external: true
