version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: tides
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tides"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    environment:
      - DATABASE_URL=postgresql://dev:devpass@postgres:5432/tides
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "5174:5173"
    environment:
      - DATABASE_URL=postgresql://dev:devpass@postgres:5432/tides
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/static:/app/apps/web/static
      - /app/apps/web/node_modules
      - /app/node_modules
    command: npm run dev -w @seas/web

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - DATABASE_URL=postgresql://dev:devpass@postgres:5432/tides
      - TIDE_URL=${TIDE_URL}
      - SEA_TEMP_URL=${SEA_TEMP_URL}
      - TIDE_SCRAPER_INTERVAL_MINUTES=60
      - TIDE_SCRAPER_DAYS_AHEAD=30
      - SEA_TEMP_SCRAPER_INTERVAL_MINUTES=30
      - WEATHER_SERVICE_INTERVAL_MINUTES=15
      - WEATHER_SERVICE_DAYS_AHEAD=7
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
