version: '3.8'

# Production Docker Compose - connects to external PostgreSQL
# Required environment variables in .env:
#   DATABASE_URL, TIDE_URL, SEA_TEMP_URL, GITHUB_REPOSITORY_OWNER

services:
  db-migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/seas-gg-database:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    networks:
      - web

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/seas-gg-web:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - web

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/seas-gg-worker:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TIDE_URL=${TIDE_URL}
      - SEA_TEMP_URL=${SEA_TEMP_URL}
      - TIDE_SCRAPER_INTERVAL_MINUTES=60
      - TIDE_SCRAPER_DAYS_AHEAD=30
      - SEA_TEMP_SCRAPER_INTERVAL_MINUTES=30
      - WEATHER_SERVICE_INTERVAL_MINUTES=15
      - WEATHER_SERVICE_DAYS_AHEAD=7
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
